<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS - Baby Clothes POS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-access="user">

  <div id="navbar"></div>

  <div class="container wide">
    <h1>Point of Sale</h1>

    <div class="pos-layout">

      <!-- LEFT SIDE: search and product cards -->
      <div class="pos-products no-print">
        <h2>Products</h2>
        <input type="text" id="searchBox" class="field"
               placeholder="Search by name, category, size, or color">
        <div id="productGrid" class="product-grid"></div>
      </div>

      <!-- RIGHT SIDE: cart, payment, and receipt -->
      <div class="pos-cart">

        <!-- Cart and payment (hidden after a sale is completed) -->
        <div id="checkoutPanel" class="no-print">
          <h2>Cart</h2>
          <div id="cartBox"></div>

          <p class="total-row">Total: <span id="totalAmount">₱0.00</span></p>

          <label for="amountPaid">Amount Paid (₱)</label>
          <input type="number" id="amountPaid" class="field" min="0" step="0.01"
                 placeholder="Enter amount paid">

          <p class="total-row">Change: <span id="changeAmount">₱0.00</span></p>

          <!-- Error and info messages show here -->
          <p id="cartMessage" class="error"></p>

          <button class="btn" onclick="completeSale()">Complete Sale</button>
          <button class="btn btn-light" onclick="clearCart()">Clear Cart</button>
        </div>

        <!-- Receipt (shown after a sale is completed) -->
        <div id="receiptPanel" style="display: none;"></div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pos.js"></script>
</body>
</html>
