<!DOCTYPE html>

</head>
<body data-access="user">

        <p>0900 000 0000</p>
      </div>
      <div class="card">
        <h3>Email</h3>
        <p>hello@babyclothesstore.example</p>
      </div>
      <div class="card">

        <p>Monday to Saturday<br>9:00 AM to 7:00 PM</p>

    </div>
  </div>

  <script src="js/data.js"></script>
