<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory - Baby Clothes POS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- data-access="admin" means only the Admin can open this page -->
<body data-access="admin">

  <div id="navbar"></div>

  <div class="container wide">
    <h1>Inventory</h1>

    <!-- Warning about low or out-of-stock items -->
    <p id="stockWarning" class="stock-warning"></p>

    <!-- ADD / EDIT FORM -->
    <div class="card">
      <h3 id="formTitle">Add New Item</h3>

      <div class="form-grid">
        <div>
          <label for="itemName">Name</label>
          <input type="text" id="itemName" class="field" placeholder="Example: Basic Onesie">
        </div>
        <div>
          <label for="itemCategory">Category</label>
          <select id="itemCategory" class="field"></select>
        </div>
        <div>
          <label for="itemSize">Size</label>
          <select id="itemSize" class="field"></select>
        </div>
        <div>
          <label for="itemColor">Color</label>
          <input type="text" id="itemColor" class="field" placeholder="Example: White">
        </div>
        <div>
          <label for="itemDesign">Design</label>
          <input type="text" id="itemDesign" class="field" placeholder="Example: Plain, Stripes, Animals">
        </div>
        <div>
          <label for="itemPrice">Price (₱)</label>
          <input type="number" id="itemPrice" class="field" min="0" step="0.01" placeholder="0.00">
        </div>
        <div>
          <label for="itemQty">Quantity</label>
          <input type="number" id="itemQty" class="field" min="0" step="1" placeholder="0">
        </div>
      </div>

      <p id="formMessage" class="error"></p>

      <button class="btn" id="saveBtn" onclick="saveProduct()">Add Item</button>
      <!-- Cancel button only shows while editing -->
      <button class="btn btn-light" id="cancelBtn" onclick="clearForm()" style="display: none;">Cancel</button>
    </div>

    <hr>

    <!-- SEARCH AND FILTER -->
    <h2>All Items</h2>
    <div class="filter-row">
      <input type="text" id="searchBox" class="field"
             placeholder="Search by name, size, color, design, or category">
      <select id="filterCategory" class="field"></select>
    </div>

    <p id="tableInfo" class="muted"></p>

    <!-- Inventory table (filled by inventory.js) -->
    <div id="inventoryTable"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/inventory.js"></script>
</body>
</html>
