<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - Baby Clothes POS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- Admin only -->
<body data-access="admin">

  <div id="navbar"></div>

  <div class="container wide">
    <h1>Sales Reports</h1>

    <!-- SEARCH AND FILTER (not printed) -->
    <div class="card no-print">
      <h3>Search &amp; Filter</h3>

      <div class="form-grid">
        <div>
          <label for="fromDate">From date</label>
          <input type="date" id="fromDate" class="field">
        </div>
        <div>
          <label for="toDate">To date</label>
          <input type="date" id="toDate" class="field">
        </div>
        <div>
          <label for="productSearch">Product</label>
          <input type="text" id="productSearch" class="field" placeholder="Name or category">
        </div>
        <div>
          <label for="cashierFilter">Cashier</label>
          <select id="cashierFilter" class="field"></select>
        </div>
      </div>

      <button class="btn" onclick="printReport()">Print Report</button>
      <button class="btn btn-light" onclick="clearFilters()">Clear Filters</button>
    </div>

    <!-- REPORT (this part is printed) -->
    <h2>Sales Report</h2>
    <p id="reportRange" class="muted"></p>
    <p id="reportInfo" class="muted"></p>
    <div id="reportTable"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
